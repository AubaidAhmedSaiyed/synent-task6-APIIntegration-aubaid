<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitScope — GitHub Explorer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="scanline"></div>

  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">⬡</span>
        <span class="brand-name">Git<em>Scope</em></span>
      </div>
      <span class="header-tag">GitHub API Explorer</span>
    </div>
  </header>

  <main>
    <section class="search-section">
      <p class="prompt-label">$ enter username</p>
      <div class="search-bar">
        <span class="search-prefix">github.com /</span>
        <input
          type="text"
          id="search-input"
          placeholder="torvalds"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="search-btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
      <div id="error-box" class="error-box hidden">
        <span class="error-icon">✕</span>
        <span id="error-msg"></span>
      </div>
    </section>

    <div id="loading" class="loading hidden">
      <div class="loader-row">
        <span class="loader-bar"></span>
        <span class="loader-text">Fetching data...</span>
      </div>
    </div>

    <section id="results" class="results hidden">

      <div class="profile-card">
        <div class="profile-left">
          <div class="avatar-wrap">
            <img id="avatar" src="" alt="Avatar" />
            <div class="avatar-ring"></div>
          </div>
        </div>
        <div class="profile-right">
          <div class="profile-name-row">
            <h1 id="profile-name">—</h1>
            <a id="profile-link" href="#" target="_blank" class="profile-link">↗ Open</a>
          </div>
          <p id="profile-login" class="profile-login">@—</p>
          <p id="profile-bio" class="profile-bio"></p>
          <div class="profile-meta">
            <span id="meta-location" class="meta-item hidden">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span id="location-text"></span>
            </span>
            <span id="meta-blog" class="meta-item hidden">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              <a id="blog-link" href="#" target="_blank"></a>
            </span>
            <span id="meta-twitter" class="meta-item hidden">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              <a id="twitter-link" href="#" target="_blank"></a>
            </span>
          </div>
          <div class="stats-row">
            <div class="stat-chip">
              <span id="stat-repos" class="stat-val">0</span>
              <span class="stat-lbl">Repos</span>
            </div>
            <div class="stat-chip">
              <span id="stat-followers" class="stat-val">0</span>
              <span class="stat-lbl">Followers</span>
            </div>
            <div class="stat-chip">
              <span id="stat-following" class="stat-val">0</span>
              <span class="stat-lbl">Following</span>
            </div>
            <div class="stat-chip">
              <span id="stat-gists" class="stat-val">0</span>
              <span class="stat-lbl">Gists</span>
            </div>
          </div>
        </div>
      </div>

      <div class="repos-header">
        <h2 class="repos-title">
          <span class="repos-title-icon">◈</span> Repositories
          <span id="repos-count" class="repos-count"></span>
        </h2>
        <div class="repos-sort">
          <label for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="stars">Stars</option>
            <option value="updated">Updated</option>
            <option value="name">Name</option>
            <option value="forks">Forks</option>
          </select>
        </div>
      </div>

      <div id="repos-grid" class="repos-grid"></div>

    </section>
  </main>

  <footer>
    <span>Built with GitHub REST API v3</span>
    <span class="footer-dot">·</span>
    <span>No auth required · Rate limit: 60 req/hr</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
